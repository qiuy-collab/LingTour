# Q1 fix helper: build the upstream URI for upload file operations from
# $request_uri (the RAW request line) instead of the decoded $uri. See the
# /api/admin/upload/files/ location in the admin server block below.
map $request_uri $upload_files_proxy_uri {
    default "";
    ~^/api/admin/upload/files/(.*)$  /api/v1/admin/upload/files/$1;
}

upstream api_backend {
    server api:8000;
}

upstream site_frontend {
    server site:3000;
}

upstream admin_frontend {
    server admin:4173;
}

server {
    listen 80;
    server_name culvoy.com _;

    client_max_body_size 105M;

    # P2-O security headers. The site is iframed by the admin preview bridge,
    # so frame-ancestors whitelists the admin origin instead of X-Frame-Options.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://admin.culvoy.com" always;

    # NOTE: nginx add_header inheritance — a location with its own add_header
    # (e.g. /uploads/ below) does NOT inherit these; headers are repeated there.

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # uploads are embedded by site/admin pages
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The site's session handler (login/register/email-code/logout cookie
    # exchange) lives in the Next.js server. Exact matches win over the
    # general /api/ forward below, which only serves direct /api/v1 calls.
    location = /api/auth/session {
        proxy_pass http://site_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/session/ {
        proxy_pass http://site_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://site_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name admin.culvoy.com;

    client_max_body_size 105M;

    # P2-O security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/admin/auth/ {
        rewrite ^/api/admin/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deleting (or reading) an upload by its STORED relative path, e.g.
    # "cities/<uuid>.jpg". The generic /api/admin/ location below matches the
    # percent-DECODED URI, so an encoded "%2F" collapses into a real "/" and
    # turns "files/cities%2Fxxx.jpg" into "files/cities/xxx.jpg" — which
    # @Delete('files/:filename') cannot match, so every such delete 404s.
    #
    # A static proxy_pass URI cannot fix this: nginx normalises/decodes the URI
    # for BOTH the rewrite and the proxy_pass forms (verified locally — %2F
    # still arrived as "/"). Passing the upstream URI through a VARIABLE makes
    # nginx skip that normalisation, and the map at the top of this file builds
    # it from $request_uri, the raw, still-encoded request line.
    location ^~ /api/admin/upload/files/ {
        proxy_pass http://api_backend$upload_files_proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        rewrite ^/api/admin/(.*)$ /api/v1/admin/$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.culvoy.com;

    client_max_body_size 105M;

    # P2-O security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # uploads are embedded by site/admin pages
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
