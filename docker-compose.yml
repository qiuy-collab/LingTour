# Local three-tier stack: site (3000), admin (5173), api (8000).
#
# The api container connects to the PostgreSQL already running on the host
# (localhost:5432) through host.docker.internal, so the local dev database
# and its migration state are shared with the previous npm-based workflow.
#
# Optional profiles:
#   --profile selfhost  start a bundled PostgreSQL instead (mapped to host
#                       5433 to avoid clashing with the host instance); then
#                       override api's DB_HOST=postgres, e.g. with a compose
#                       override file.
#   --profile gateway   start the nginx gateway on 80/443 for same-origin
#                       /api proxying; not needed for the default split-port
#                       local addresses documented in AGENT.md.
#
# API configuration comes from api/.env via env_file (single source of
# truth); only DB_HOST is overridden here for the container network.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["selfhost"]
    environment:
      POSTGRES_DB: lingtour
      POSTGRES_USER: lingtour
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lingtour_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingtour"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_HOST: host.docker.internal
    volumes:
      - ./api/uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
      args:
        # Same-origin base, matching production: the browser calls /api and
        # /uploads on the site origin (port 3000) and next.config rewrites
        # proxy them to the api container. The INTERNAL_API_ORIGIN build arg
        # keeps that rewrite target on the container network; without it the
        # build would bake in the public fallback domain and the local stack
        # would read production data.
        NEXT_PUBLIC_API_URL: /api/v1
        INTERNAL_API_ORIGIN: http://api:8000/api/v1
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    environment:
      INTERNAL_API_ORIGIN: http://api:8000/api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        VITE_MEDIA_ORIGIN: http://localhost:8000
        VITE_SITE_ORIGIN: http://localhost:3000
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      # server.cjs proxies browser /api/admin calls to the api container.
      VITE_API_ORIGIN: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:4173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4173').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["gateway"]
    depends_on:
      - api
      - site
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro

volumes:
  pgdata:
  uploads:
