# Q1 fix helper: build the upstream URI for upload file operations from
# $request_uri (the RAW request line) instead of the decoded $uri. See the
# /api/admin/upload/files/ location below.
map $request_uri $upload_files_proxy_uri {
    default "";
    ~^/api/admin/upload/files/(.*)$  /api/v1/admin/upload/files/$1;
}

upstream api_backend {
    server api:8000;
}

upstream site_frontend {
    server site:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 105M;

    # Static uploads served directly by nginx
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Admin API authentication proxy - rewrite /api/admin/auth/* to /api/v1/auth/*
    location /api/admin/auth/ {
        rewrite ^/api/admin/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deleting (or reading) an upload by its STORED relative path, e.g.
    # "cities/<uuid>.jpg". The generic /api/admin/ location below matches the
    # percent-DECODED URI, so an encoded "%2F" collapses into a real "/" and
    # turns "files/cities%2Fxxx.jpg" into "files/cities/xxx.jpg" — which
    # @Delete('files/:filename') cannot match, so every such delete 404s.
    #
    # A static proxy_pass URI cannot fix this: nginx normalises/decodes the URI
    # for BOTH the rewrite and the proxy_pass forms (verified locally — %2F
    # still arrived as "/"). Passing the upstream URI through a VARIABLE makes
    # nginx skip that normalisation, and the map above builds it from
    # $request_uri, which is the raw, still-encoded request line.
    location ^~ /api/admin/upload/files/ {
        proxy_pass http://api_backend$upload_files_proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API proxy - rewrite /api/admin/* to /api/v1/admin/*
    location /api/admin/ {
        rewrite ^/api/admin/(.*)$ /api/v1/admin/$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://site_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
